<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Anthony Aziz Kurieh | Data Professional</title>

<!-- Clean modern font with precise spacing -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --table:#0f0f10;
    --paper:#f4f1ea;
    --ink:#151515;
    --muted:rgba(21,21,21,.70);
    --hair:rgba(21,21,21,.14);
    --hair2:rgba(21,21,21,.09);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:var(--table);
    color:var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* subtle spotlight */
  .stage{
    width:min(920px, 96vw);
    padding:52px 18px;
    border-radius:22px;
    background:
      radial-gradient(70% 50% at 50% 35%, rgba(255,255,255,.11), rgba(255,255,255,0)),
      radial-gradient(40% 28% at 50% 72%, rgba(255,255,255,.06), rgba(255,255,255,0));
    display:grid;
    place-items:center;
  }

  .card{
    width:min(640px, 96vw);
    aspect-ratio: 1.85 / 1; /* less wide, more business-card */
    background:var(--paper);
    border-radius:12px;
    position:relative;
    overflow:hidden;

    box-shadow:
      0 32px 90px rgba(0,0,0,.62),
      0 1px 0 rgba(255,255,255,.25) inset,
      0 -1px 0 rgba(0,0,0,.05) inset;
  }

  /* paper grain */
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0)),
      repeating-linear-gradient(90deg, rgba(0,0,0,.012) 0 1px, rgba(0,0,0,0) 1px 7px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.010) 0 1px, rgba(0,0,0,0) 1px 10px);
    mix-blend-mode:multiply;
    opacity:.55;
    pointer-events:none;
  }

  /* IMPORTANT: don’t steal clicks */
  .card::after{
    content:"";
    position:absolute;
    inset:0;
    border:1px solid rgba(0,0,0,.10);
    border-radius:12px;
    pointer-events:none;
  }

  .pad{
    position:absolute;
    inset:0;
    padding:54px 56px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:18px;
  }

  /* top row */
  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .top .right{
    text-align:right;
  }

  /* center block */
  .center{
    text-align:center;
    margin-top:-6px; /* subtle lift like the scene */
  }

  .name{
    margin:0;
    font-size:34px;
    font-weight:600;
    letter-spacing:.10em;
    text-transform:uppercase;
  }

  .title{
    margin-top:14px;
    font-size:14px;
    font-weight:500;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(21,21,21,.82);
  }

  .tagline{
    margin-top:12px;
    font-size:11px;
    font-weight:500;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:rgba(21,21,21,.52);
  }

  .rule{
    width:100%;
    height:1px;
    background:var(--hair2);
    margin:26px 0 18px;
  }

  /* buttons: clean, “printed” feel */
  .actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
  }

  a.btn{
    text-decoration:none;
    color:var(--ink);
    padding:12px 18px;
    border-radius:10px;
    border:1px solid var(--hair);
    background:rgba(255,255,255,.18);
    font-family:inherit;
    font-size:11px;
    font-weight:500;
    letter-spacing:.30em;
    text-transform:uppercase;

    box-shadow:
      0 1px 0 rgba(255,255,255,.35) inset,
      0 -1px 0 rgba(0,0,0,.04) inset;

    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }

  a.btn:hover{
    transform:translateY(-1px);
    background:rgba(255,255,255,.34);
    border-color:rgba(21,21,21,.20);
  }

  /* bottom row */
  .bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:14px;
    font-size:11px;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .bottom a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid rgba(21,21,21,.18);
    padding-bottom:2px;
  }

  @media (max-width:520px){
    .pad{ padding:40px 26px; }
    .name{ font-size:28px; }
  }
</style>
</head>

<body>
  <div class="stage">
    <div class="card" role="region" aria-label="Digital business card">
      <div class="pad">

        <div class="top">
          <div>+971 50 497 3929</div>
          <div class="right">Data Professional</div>
        </div>

        <div class="center">
          <h1 class="name">Anthony Aziz Kurieh</h1>
          <div class="title">Data Professional</div>
          <div class="tagline">Less Noise, More Signal</div>

          <div class="rule"></div>

          <div class="actions">
            <a class="btn" href="https://www.linkedin.com/in/anthony-kurieh/" target="_blank" rel="noopener">LinkedIn</a>
            <a class="btn" href="cv.pdf" target="_blank" rel="noopener">CV (PDF)</a>
            <a class="btn" href="contact.vcf" rel="noopener">Save Contact</a>
          </div>
        </div>

        <div class="bottom">
          <div><a href="mailto:anthony.kurieh@outlook.com">anthony.kurieh@outlook.com</a></div>
          <div>Dubai · Available Globally</div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
