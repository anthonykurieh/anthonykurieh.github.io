<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Name</title>

  <style>
    :root{
      --paper:#f4f1ea;       /* warm off-white */
      --ink:#121212;
      --muted:#4a4a4a;
      --rule:rgba(18,18,18,.14);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: #0f0f10;
      color:var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
    }

    /* subtle spotlight like a table in a dark room */
    .stage{
      width:min(720px, 92vw);
      padding:42px 18px;
      display:grid;
      gap:18px;
      place-items:center;
      background:
        radial-gradient(70% 50% at 50% 35%, rgba(255,255,255,.10), rgba(255,255,255,0)),
        radial-gradient(40% 30% at 50% 65%, rgba(255,255,255,.06), rgba(255,255,255,0));
      border-radius:18px;
    }

    .card{
      width:min(520px, 92vw);
      aspect-ratio: 1.75 / 1; /* business card-ish */
      border-radius: 10px;
      background: var(--paper);
      position: relative;
      overflow:hidden;

      /* “printed stock” feel */
      box-shadow:
        0 16px 40px rgba(0,0,0,.55),
        0 1px 0 rgba(255,255,255,.18) inset;
      transform: translateZ(0);
    }

    /* paper grain */
    .card::before{
      content:"";
      position:absolute; inset:0;
      background:
        linear-gradient(0deg, rgba(255,255,255,.10), rgba(255,255,255,0)),
        repeating-linear-gradient(90deg, rgba(0,0,0,.015) 0 1px, rgba(0,0,0,0) 1px 6px),
        repeating-linear-gradient(0deg, rgba(0,0,0,.010) 0 1px, rgba(0,0,0,0) 1px 7px);
      mix-blend-mode:multiply;
      opacity:.55;
      pointer-events:none;
    }

    /* faint edge bevel */
    .card::after{
      content:"";
      position:absolute; inset:0;
      border:1px solid rgba(0,0,0,.10);
      border-radius:10px;
      pointer-events:none;
    }

    .pad{
      position:absolute; inset:0;
      padding:32px 34px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:14px;
    }

    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
    }

    .name{
      font-size: 28px;
      letter-spacing: .02em;
      margin:0;
      line-height:1.05;
      font-weight:600;
      text-transform: uppercase;
    }

    .title{
      margin:8px 0 0;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .rule{
      height:1px;
      background: var(--rule);
      width:100%;
    }

    .links{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:2px;
    }

    .btnrow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    a.btn{
      text-decoration:none;
      color:var(--ink);
      border:1px solid rgba(18,18,18,.18);
      background: rgba(255,255,255,.35);
      padding:10px 12px;
      border-radius: 8px;
      font-size: 12px;
      letter-spacing:.10em;
      text-transform: uppercase;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      transition: transform .12s ease, background .12s ease;
    }

    a.btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.55);
    }

    .contact{
      display:grid;
      gap:6px;
      font-size: 12px;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing:.02em;
    }

    .contact a{
      color:inherit;
      text-decoration:none;
      border-bottom:1px solid rgba(18,18,18,.18);
      width:max-content;
    }

    .footer{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
    }

    .micro{
      font-size:10px;
      letter-spacing:.18em;
      text-transform: uppercase;
      color: rgba(18,18,18,.55);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* optional: tiny monogram */
    .mark{
      width:38px; height:38px;
      border:1px solid rgba(18,18,18,.16);
      border-radius:10px;
      display:grid;
      place-items:center;
      font-weight:700;
      letter-spacing:.08em;
      background: rgba(255,255,255,.28);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    @media (max-width:420px){
      .pad{ padding:26px 24px; }
      .name{ font-size:24px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="card" role="region" aria-label="Digital business card">
      <div class="pad">
        <div class="top">
          <div>
            <h1 class="name">YOUR NAME</h1>
            <p class="title">AI Engineer · Data & Analytics</p>
          </div>
          <div class="mark">YN</div>
        </div>

        <div>
          <div class="rule"></div>
          <div class="links">
            <div class="btnrow">
              <a class="btn" href="https://www.linkedin.com/in/YOURPROFILE" target="_blank" rel="noopener">LinkedIn</a>
              <a class="btn" href="cv.pdf" target="_blank" rel="noopener">CV (PDF)</a>
              <a class="btn" href="contact.vcf">Save Contact</a>
            </div>

            <div class="contact">
              <div><a href="mailto:you@email.com">you@email.com</a></div>
              <div><a href="tel:+971XXXXXXXXX">+971 XX XXX XXXX</a></div>
            </div>
          </div>
        </div>

        <div class="footer">
          <div class="micro">Clean. Fast. Trackable.</div>
          <div class="micro">Dubai · Remote</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
