<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anthony Kurieh</title>

<style>
/* ---- Reset ---- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ---- Background (dark room effect) ---- */
body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0e0e;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

/* ---- Card ---- */
.card {
    width: 520px;
    max-width: 90vw;
    padding: 64px 56px;
    background: #f5f5f2;
    color: #111;

    /* subtle physical feel */
    box-shadow:
        0 25px 60px rgba(0,0,0,0.55),
        0 1px 0 rgba(255,255,255,0.4) inset;

    border-radius: 4px;

    /* everything centered */
    text-align: center;
}

/* ---- Name ---- */
.name {
    font-size: 28px;
    letter-spacing: 3px;
    font-weight: 500;
}

/* ---- Title ---- */
.title {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 4px;
    color: #555;
    text-transform: uppercase;
}

/* ---- Divider ---- */
.rule {
    width: 60px;
    height: 1px;
    background: rgba(0,0,0,0.25);
    margin: 32px auto;
}

/* ---- Links ---- */
.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.links a {
    text-decoration: none;
    color: #111;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 10px 0;
    border-top: 1px solid rgba(0,0,0,0.12);
    border-bottom: 1px solid rgba(0,0,0,0.12);
    transition: background 0.2s ease;
}

.links a:hover {
    background: rgba(0,0,0,0.035);
}

/* ---- Contact ---- */
.contact {
    margin-top: 34px;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #444;
    line-height: 1.8;
}

/* ---- Small footer line ---- */
.footer {
    margin-top: 40px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(0,0,0,0.45);
    text-transform: uppercase;
}
</style>
</head>

<body>

<div class="card">

    <div class="name">ANTHONY KURIEH</div>

    <div class="title">Data Professional</div>

    <div class="rule"></div>

    <div class="links">
        <a href="https://www.linkedin.com/in/anthony-kurieh/" target="_blank">
            LinkedIn
        </a>

        <a href="cv.pdf" target="_blank">
            Curriculum Vitae
        </a>

        <a href="contact.vcf">
            Save Contact
        </a>
    </div>

    <div class="contact">
        anthony.kurieh@outlook.com<br>
        +961 50 497 3929
    </div>

    <div class="footer">
        Dubai · Available Globally
    </div>

</div>

</body>
</html>
