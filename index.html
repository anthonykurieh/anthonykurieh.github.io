<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Anthony Aziz Kurieh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:opsz,wght@8..40,400,500,600&display=swap" rel="stylesheet">

<style>
:root{
  --table:#0f0f10;
  --paper:#f4f1ea;
  --ink:#141414;
  --hair:rgba(20,20,20,.16);
  --hair2:rgba(20,20,20,.10);
}

/* one consistent font everywhere */
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:var(--table);
  color:var(--ink);
  font-family:
    "Copperplate",
    "Copperplate Gothic Light",
    "Copperplate Gothic",
    "EB Garamond",
    serif;
}

/* lighting */
.stage{
  width:min(920px,96vw);
  padding:46px 18px;
  border-radius:22px;
  background:
    radial-gradient(70% 50% at 50% 35%, rgba(255,255,255,.10), rgba(255,255,255,0)),
    radial-gradient(40% 28% at 50% 72%, rgba(255,255,255,.06), rgba(255,255,255,0));
  display:grid;
  place-items:center;
}

.card{
  width:min(760px,96vw);
  aspect-ratio:2.55/1;
  background:var(--paper);
  border-radius:10px;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 30px 80px rgba(0,0,0,.60),
    0 1px 0 rgba(255,255,255,.22) inset,
    0 -1px 0 rgba(0,0,0,.05) inset;
}

/* paper texture */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.012) 0 1px, rgba(0,0,0,0) 1px 7px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.010) 0 1px, rgba(0,0,0,0) 1px 9px);
  mix-blend-mode:multiply;
  opacity:.62;
  pointer-events:none;
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(0,0,0,.10);
  border-radius:10px;
}

.pad{
  position:absolute;
  inset:0;
  padding:38px 44px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* top row */
.top{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  letter-spacing:.06em;
  color:rgba(20,20,20,.70);
}
.top .right{
  text-align:right;
}

/* center */
.center{
  text-align:center;
}

.name{
  margin:0;
  font-size:34px;
  font-weight:600;
  letter-spacing:.06em;
}

.title{
  margin-top:10px;
  font-size:18px;
  letter-spacing:.04em;
}

.tagline{
  margin-top:10px;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(20,20,20,.50);
}

.rule{
  width:100%;
  height:1px;
  background:var(--hair2);
  margin:18px 0 14px;
}

/* buttons */
.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}

a.btn{
  text-decoration:none;
  color:var(--ink);
  padding:10px 16px;
  border-radius:9px;
  border:1px solid var(--hair);
  background:rgba(255,255,255,.22);
  font-family:inherit;
  font-size:11px;
  letter-spacing:.24em;
  text-transform:uppercase;
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 -1px 0 rgba(0,0,0,.04) inset;
  transition:.12s ease;
}

a.btn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.38);
}

/* bottom */
.bottom{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  letter-spacing:.06em;
  color:rgba(20,20,20,.70);
}

.bottom a{
  color:inherit;
  text-decoration:none;
  border-bottom:1px solid rgba(20,20,20,.18);
}

.smallcaps{
  font-variant:small-caps;
  letter-spacing:.10em;
  color:rgba(20,20,20,.56);
}
</style>
</head>

<body>
<div class="stage">
  <div class="card">
    <div class="pad">

      <div class="top">
        <div>+971 50 497 3929</div>
        <div class="right">
          Data Professional<br>Dubai
        </div>
      </div>

      <div class="center">
        <h1 class="name">Anthony Aziz KURIEH</h1>
        <div class="title">Data Professional</div>
        <div class="tagline">Less Noise, More Signal</div>

        <div class="rule"></div>

        <div class="actions">
          <a class="btn" href="https://www.linkedin.com/in/anthony-kurieh/" target="_blank">LinkedIn</a>
          <a class="btn" href="cv.pdf" target="_blank">CV (PDF)</a>
          <a class="btn" href="contact.vcf">Save Contact</a>
          <a class="btn" href="mailto:anthony.kurieh@outlook.com">Email</a>
        </div>
      </div>

      <div class="bottom">
        <div><a href="mailto:anthony.kurieh@outlook.com">anthony.kurieh@outlook.com</a></div>
        <div class="smallcaps">Dubai · Available Globally</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
