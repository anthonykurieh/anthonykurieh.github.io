<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anthony Aziz Kurieh</title>

<style>
:root{
  --table:#0f0f10;
  --paper:#f4f1ea;
  --ink:#141414;
  --muted:rgba(20,20,20,.65);
  --hair:rgba(20,20,20,.14);
  --hair2:rgba(20,20,20,.09);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:var(--table);
  color:var(--ink);
  font-family:
    "Optima",
    "Optima LT Std",
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;
}

.stage{
  width:min(920px,96vw);
  padding:54px 18px;
  display:grid;
  place-items:center;
}

/* CARD */
.card{
  width:min(640px,92vw);
  aspect-ratio:1.9/1;
  background:var(--paper);
  border-radius:12px;
  position:relative;
  overflow:hidden;
  box-shadow:0 32px 90px rgba(0,0,0,.62);
}

/* paper texture */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.012) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.010) 0 1px, transparent 1px 10px);
  opacity:.4;
  pointer-events:none;
}

/* MAIN GRID */
.layout{
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding-top:26px;
  padding-bottom:26px;
  padding-left:26px;
  padding-right:26px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  font-size:12px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
}

/* CENTER */
.center{
  align-self:center;
  text-align:center;
}

.name{
  margin:0;
  font-size:clamp(22px,5.2vw,34px);
  font-weight:500;
  letter-spacing:clamp(.06em,0.9vw,.12em);
  text-transform:uppercase;
}

.title{
  margin-top:14px;
  font-size:clamp(11px,2.6vw,14px);
  letter-spacing:clamp(.18em,0.9vw,.30em);
  text-transform:uppercase;
}

.tagline{
  margin-top:12px;
  font-size:clamp(9px,2.2vw,11px);
  letter-spacing:clamp(.18em,1vw,.34em);
  text-transform:uppercase;
  color:rgba(20,20,20,.5);
}

.rule{
  height:1px;
  background:var(--hair2);
  margin:26px 0 18px;
}

/* BUTTONS */
.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

a.btn{
  text-decoration:none;
  color:var(--ink);
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--hair);
  background:rgba(255,255,255,.2);
  font-size:clamp(9px,2.2vw,11px);
  letter-spacing:clamp(.18em,0.9vw,.28em);
  text-transform:uppercase;
  transition:.12s ease;
}

a.btn:hover{
  background:rgba(255,255,255,.35);
}

/* FOOTER */
.footer{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  font-size:11px;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--muted);
}

.footer a{
  color:inherit;
  text-decoration:none;
  border-bottom:1px solid rgba(20,20,20,.18);
}

/* MOBILE TUNING */
@media (max-width:480px){
  .stage{ padding:26px 12px; }

  .layout{
    padding-top:18px;
    padding-bottom:18px;
    padding-left:18px;
    padding-right:18px;
  }

  .rule{
    margin:18px 0 14px;
  }

  .header, .footer{
    font-size:10px;
    letter-spacing:.18em;
  }
}
</style>
</head>

<body>
<div class="stage">
  <div class="card">
    <div class="layout">

      <div class="header">
        <div>+971 50 497 3929</div>
        <div>AI, Data &amp; Analytics</div>
      </div>

      <div class="center">
        <h1 class="name">Anthony Aziz Kurieh</h1>
        <div class="title">Data Professional</div>
        <div class="tagline">Less Noise, More Signal</div>

        <div class="rule"></div>

        <div class="actions">
          <a class="btn" href="https://www.linkedin.com/in/anthony-kurieh/" target="_blank">LinkedIn</a>
          <a class="btn" href="cv.pdf" target="_blank">CV (PDF)</a>
          <a class="btn" href="contact.vcf">Save Contact</a>
        </div>
      </div>

      <div class="footer">
        <div><a href="mailto:anthony.kurieh@outlook.com">anthony.kurieh@outlook.com</a></div>
        <div>Dubai, UAE</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
